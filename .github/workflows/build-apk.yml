name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (requires tag or release notes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Verify Flutter Environment
        run: flutter --version

      - name: Install Dependencies
        working-directory: vaulty
        run: flutter pub get

      - name: Static Code Analysis
        working-directory: vaulty
        run: flutter analyze

      - name: Execute Automated Test Suite
        working-directory: vaulty
        run: flutter test

      - name: Build Production Release APK
        working-directory: vaulty
        run: flutter build apk --release

      - name: Prepare Artifacts & Calculate Checksum
        run: |
          mkdir -p dist
          cp vaulty/build/app/outputs/flutter-apk/app-release.apk dist/Vaulty-release.apk
          cd dist
          sha256sum Vaulty-release.apk > Vaulty-release.apk.sha256
          echo "SHA256 Checksum:"
          cat Vaulty-release.apk.sha256

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaulty-Release-APK
          path: |
            dist/Vaulty-release.apk
            dist/Vaulty-release.apk.sha256
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual Release)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vaulty-release.apk
            dist/Vaulty-release.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

