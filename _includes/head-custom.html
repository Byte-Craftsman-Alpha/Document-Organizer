<link rel="icon" type="image/png" href="{{ '/docs/assets/vaulty_icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/docs/assets/vaulty_icon.png' | relative_url }}">

<!-- Mermaid.js Client-Side Renderer for GitHub Pages -->
<style>
  .mermaid {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(244, 221, 218, 0.15);
    border: 1px solid rgba(140, 72, 67, 0.2);
    border-radius: 16px;
    padding: 24px;
    margin: 28px 0;
    overflow-x: auto;
  }
  .mermaid svg {
    max-width: 100% !important;
    height: auto !important;
  }
</style>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  function renderMermaidDiagrams() {
    const codeBlocks = document.querySelectorAll(
      'pre > code.language-mermaid, div.language-mermaid pre code, pre.language-mermaid'
    );
    if (codeBlocks.length === 0) return;

    codeBlocks.forEach((codeBlock) => {
      const container =
        codeBlock.closest('.language-mermaid') || codeBlock.closest('pre');
      if (!container) return;

      const mermaidDiv = document.createElement('div');
      mermaidDiv.className = 'mermaid';
      mermaidDiv.textContent = codeBlock.textContent;

      container.parentNode.replaceChild(mermaidDiv, container);
    });

    mermaid.initialize({
      startOnLoad: true,
      theme: 'neutral',
      securityLevel: 'loose',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderMermaidDiagrams);
  } else {
    renderMermaidDiagrams();
  }
</script>
